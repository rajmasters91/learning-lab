```docker run --rm --entrypoint vllm vllm/vllm-openai:v0.31.0-ubuntu2404 bench serve --help```
Flags:

--backend vllm :  specify the type of backend/endpoint to use for benchmark. default is openai. we use vllm.
--model : model name. we use meta-llama/Llama-3.1-8B-Instruct 
--dataset-name random : Name of the dataset to benchmark on. (default = random)
--random-input-len 512 : Number of input tokens per request, used only for random sampling. (default=1024) 
--random-output-len 128 : Number of output tokens per request, used only for random sampling. (default=128). Hardlimit.
--num-prompts 200 :  Total number of prompts to process. (default=1000)
--request-rate: Number of prompt requests per second. If this is inf (i.e., infinite), then all 200 requests are sent at time 0. Otherwise, Poisson process or gamma distribution was used to synthesize the request arrival times. (default=inf). inf help find max throughput.
--ignore-eos: EOS => "End of Sequence" token generated by LLM when it finished answering a prompt. ignore_eos flag is used when sending benchmark request =>  model is forced to keep generating text until it hits a hard token limit (ie., "--random-output-len"). (default=false).
--seed: Random seed for reproducibility. (default=42). same seed = same prompt.
--save-result: save benchmark results to a json file (default=False)
--result-dir:  Specify directory to save benchmark json results. If not specified, results are saved in the current directory.
--endpoint ENDPOINT:  API endpoint. (default=/v1/completions)
Note:

1. Which endpoint does the tool call, and does it apply a chat template? (It matters for prefix caching and for comparing to Session 3’s numbers.)

tool calls v1/completions endpoint by default. No chat template applied.
session3 used "/v1/chat/completions" endpoint => added 35 template tokens to every request + ~40 ms overhead on first token. 

Benchmark uses /v1/completions with raw random tokens => no chat template, no shared prefix => No hit for prefix caching. 

Explains why rate-1 redo’s TTFT (36 ms) came close to pure prefill compute, lower than Session 3’s chat-endpoint numbers. 

=> Different endpoint, different baseline; don’t compare them directly.

2. What does --ignore-eos guarantee, and what was the Session 3 equivalent?
It guarantees that the output will be of a fixed number of tokens. This ensures benchmarking is comparable across runs of different rates.
session3's equivalent = "min_tokens:64". It was added when short prompt stopped at 59 tokens.

--random-output-len with --ignore-eos is not a “hard limit” but an exact length; every request produces exactly 128 tokens.


3. If I run the same command twice with the same --seed, are the prompts the same? What does that do to the second run? Decide what seed policy you’ll use for repeats, and write it down.

yes prompts are same. the second run will use kvcache.
My prediction:  ttft and tpot will be low since nothing was regenerated.  --> WRONG

Fact: A repeated prompt gets its prefill from cache, so TTFT drops. But decode isn’t cached; every token is still generated, so TPOT is unchanged. session3 stream outputs => 182 vs 45 ms to first token, identical 11.5 ms spacing afterwards. 



Seed policy: should use different seeds for each repeat run so that benchmarking is given a new set of prompts for each run.  i.e, different seed per repeat run (e.g., 42, 43, 44), recorded in config.yaml next to the run names.

